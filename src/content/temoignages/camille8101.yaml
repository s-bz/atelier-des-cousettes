auteur: Camille8101
texte: >-
  Je participe aux ateliers organisés par Isabelle de manière régulière depuis
  un peu plus de six mois et j'en suis ravie! Les ateliers se déroulent dans
  un cadre tranquille et agréable, Isabelle se rend toujours disponible pour
  nous aider à progresser à notre rythme et nous faire bénéficier de son
  savoir. Grâce à elle j'ai énormément progressé en peu de temps et gagné en
  confiance. J'ai hâte de continuer les cours et les recommande à tous.
