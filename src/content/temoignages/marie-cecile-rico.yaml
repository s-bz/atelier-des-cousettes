auteur: Marie-cecile Rico
texte: >-
  Adhérente à l'association depuis 3 ans, j'ai commencé les cours sans aucune
  notion du coutume. Les ateliers se font par groupe de 3 voir 4 maximum ce
  qui permet à la professeur d'être disponible pour chaque personne à tour de
  rôle pendant toute la séance. Isabelle est très pédagogue, patiente toujours
  de très bons conseils. Pour être partie de zéro je peux dire que je suis
  très satisfaite de mon évolution et apprentissage. Maintenant mon entourage
  a toujours des commandes à me faire réaliser !! Je recommande pour toute
  personne quelque soit son niveau car rien n'est imposé et impossible quand
  on est volontaire et patient.
