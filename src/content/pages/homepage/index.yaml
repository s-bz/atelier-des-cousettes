title: L'Atelier des Cousettes
heroTitle: Apprenez à coudre en petits groupes, entre Haute-Garonne et Tarn
subtitle: À Revel et Verdalle, à 20 min de Castres — débutants bienvenus
seoTitle: Cours de couture à Revel et Castres
seoDescription: >-
  Cours de couture, ateliers et stages à Revel (Haute-Garonne) et Verdalle
  (Tarn), à 20 min de Castres. Petits groupes, à partir de 22€. Isabelle,
  couturière diplômée CAP.
coverImage: /src/assets/images/covers/homepage/coverImage.jpeg
heroLinkLabel: Voir les formules
introductionTitle: Le plaisir de coudre entre Haute-Garonne et Tarn
introduction: >-
  Vous désirez créer vos propres vêtements, maîtriser votre machine à coudre ou
  simplement de passer un moment créatif ? Isabelle vous accueille en petits
  groupes à Revel et Verdalle, à 20 minutes de Castres.
introduction2: Débutants ou confirmés, choisissez la formule qui vous correspond.
serviceCards:
  - label: Ateliers réguliers
    href: /ateliers-reguliers/
    image: /src/assets/images/homepage/serviceCards/0/image.jpg
    imageAlt: >-
      Une participante pose un patron sur un coton fleuri, entre ciseaux, mètre
      ruban, règle de patronage et pelote à épingles
    priceRange: 36 €/mois pour 9 séances (25 € ado, 34 € enfant)
    shortDescription: >-
      Progressez en petits groupes, une à deux fois par mois, de septembre à
      juin.
  - label: Stages thématiques
    href: /stages-thematiques/
    image: /src/assets/images/homepage/serviceCards/1/image.jpg
    imageAlt: >-
      Sac en toile bleu canard à empiècement fleuri turquoise et doré, fermé par
      une glissière écrue, accroché à une palissade en bois
    priceRange: De 45 € à 80 € le stage
    shortDescription: >-
      Découvrez la machine à coudre, la surjeteuse, initiez-vous au patronage ou
      réalisez un petit projet.
  - label: Séances sans engagement
    href: /seances-sans-engagement/
    image: /src/assets/images/homepage/serviceCards/2/image.jpg
    imageAlt: >-
      Bobines de fil, dé à coudre, mètre ruban et ciseaux posés près d'une
      machine à coudre
    priceRange: 45 € la séance de 3 h (22 € en 1 h 30)
    shortDescription: >-
      Une séance ponctuelle, sans engagement, pour apprendre une technique
      précise ou pour avancer sur un projet personnel.
orientationText: >-
  Vous ne savez pas par où commencer ? Venez d'abord pour une séance sans
  engagement, à partir de 22 €. Si le courant passe, le forfait de la saison
  s'ouvre ensuite.
valuePropositionsTitle: Pourquoi choisir L'Atelier des Cousettes ?
valuePropositions:
  - title: Petits groupes
    description: >-
      Un accompagnement individualisé pour progresser à votre rythme, quel que
      soit votre niveau. Les groupes sont volontairement limités pour garantir
      un suivi de qualité.
  - title: Tous niveaux bienvenus
    description: >-
      Des grands débutants qui n'ont jamais touché une machine à coudre aux
      couturiers confirmés souhaitant se perfectionner, chacun trouve sa place.
  - title: Pas de machine ? Isabelle en prête
    description: >-
      Vous n'avez pas encore de machine à coudre, ou vous n'osez pas investir
      avant d'avoir essayé ? Isabelle en prête une, sur simple demande au moment
      de l'inscription. Vous pouvez donc venir les mains vides à votre première
      séance.
  - title: Des formules pour tous
    description: >-
      Ateliers réguliers une à deux fois par mois, stages thématiques ponctuels
      ou séances de couture sans engagement. Il y a forcément une formule qui
      vous correspond.
  - title: Tarifs accessibles
    description: De 22 € à 80 € selon la formule choisie, tissu et fournitures non compris.
  - title: Deux lieux de cours
    description: >-
      À la maison des associations de Revel (Haute-Garonne) et à l'atelier privé
      de Verdalle (Tarn).
animatriceTitle: Votre animatrice
animatriceText: >
  Isabelle Bultez enseigne la couture depuis plus de dix ans. Diplômée du CAP
  couture flou, elle a fondé L'Atelier des Cousettes pour partager sa passion
  avec des élèves de tous âges et de tous niveaux.


  Son parcours mêle héritage familial — son arrière grand-père était tailleur —
  passion pour le patronage et engagement artisanal. Son approche est
  bienveillante et personnalisée : chaque participant progresse à son rythme sur
  le projet de son choix.
animatriceImage: /src/assets/images/homepage/animatriceImage.jpg
animatriceImageAlt: Isabelle Bultez, couturière diplômée CAP
animatriceLinkLabel: Découvrir le parcours d'Isabelle
