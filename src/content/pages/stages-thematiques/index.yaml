stages:
  - name: Initiation machine à coudre
    shortDescription: >-
      Découvrez les possibilités de votre machine grâce à des exercices
      pratiques : boutonnières, fermeture éclair, points décoratifs.
    fullDescription: |
      Nous pratiquerons les différentes possibilités qu'offre votre machine grâce à de petits exercices : boutonnières, fermeture éclair, points décoratifs et nous finirons avec une petite réalisation, pochette ou étui. Vous pouvez venir avec des coupons de tissus, bouton et fermeture éclair mais je peux également proposer quelques fournitures.

      Chaque machine étant différente, il est préférable d'apprendre sur sa propre machine et de venir avec tous les accessoires et sa notice. Je peux cependant prêter une machine (merci de me le demander au préalable). Prenez également un petit cahier pour prendre des notes afin de gagner en autonomie.
    prerequisite: ''
    articles:
      - choisir-machine-a-coudre
      - entretenir-machine-a-coudre
      - debuter-couture-conseils
  - name: Stage surjeteuse
    shortDescription: >-
      Apprivoisez la surjeteuse : enfilage, réglages, points de base, puis
      réalisation d'un t-shirt simple.
    fullDescription: |
      Ce stage propose une approche de cette étrange machine. Au programme : surmonter la première difficulté c'est-à-dire l'enfilage et le réglage, puis pratiquer quelques points de base et effectuer les corrections nécessaires et passer enfin à une réalisation simple pour apprivoiser la machine !
    prerequisite: Connaissance de base de la machine à coudre recommandée.
    articles:
      - surjeteuse-a-quoi-ca-sert
      - choisir-fil-aiguille
  - name: Stage patronage de jupe
    shortDescription: >-
      Tracez le patron d'une jupe à vos propres mesures, puis cousez-la dans la
      journée. Une jupe qui tombe juste, parce qu'elle est faite pour vous.
    fullDescription: |
      Vous rêvez de faire vos vêtements, vous avez des idées mais il vous manque la méthode… Si vous acceptez de passer par un peu de géométrie, vous apprendrez à tracer le patron d'une jupe à vos propres mesures.

      La journée entière y est consacrée : la prise de mesures et le tracé le matin, la coupe et l'assemblage l'après-midi. Vous repartez avec votre patron — réutilisable autant de fois que vous voudrez — et avec votre jupe.

      À partir de ce tracé de base, vous pourrez ensuite apprendre à faire vous-même les transformations pour créer votre modèle unique !
    prerequisite: Connaissance de base de la machine à coudre recommandée.
    articles:
      - comprendre-patrons-couture
      - prendre-ses-mesures
      - coudre-jupe-elastiquee-premier-vetement
  - name: Stage banane
    shortDescription: >-
      Choisissez vos matières, vos tissus, votre style pour créer un accessoire
      qui vous accompagne au quotidien !
    fullDescription: |
      Choisissez vos matières, vos tissus, votre style pour créer un accessoire qui vous accompagne au quotidien !
    prerequisite: Connaissance de base de la machine à coudre recommandée.
    articles:
      - coudre-trousse-fermeture-eclair
      - couture-ete-accessoires-vacances
  - name: Stage trousse
    shortDescription: >-
      Une trousse doublée, fermée par une vraie fermeture éclair — le geste qui
      fait peur, appris sur un petit objet.
    fullDescription: |
      La fermeture éclair est le passage que la plupart des débutants repoussent. Ce stage la fait poser sur un objet assez petit pour être fini dans la matinée, et assez utile pour resservir tous les jours.

      Au programme : le choix des tissus et de la doublure, la coupe, la pose de la fermeture, puis le montage et les finitions. Vous repartez avec votre trousse.
    prerequisite: Connaissance de base de la machine à coudre recommandée.
    articles:
      - coudre-trousse-fermeture-eclair
      - retouches-simples-ourlet-bouton-fermeture
  - name: Stage sac et tote bag
    shortDescription: >-
      Réalisez un sac simple à vos mesures et dans le tissu de votre choix.
      Accessible aux débutants sachant utiliser une machine à coudre.
    fullDescription: |
      C'est un stage accessible aux débutants sachant utiliser une machine à coudre. Il offre la possibilité de réaliser un sac simple à vos mesures et dans le tissu de votre choix.
    prerequisite: Connaissance de base de la machine à coudre recommandée.
    articles:
      - coudre-tote-bag
      - couture-zero-dechet-projets-pratiques
  - name: Stage gilet de berger réversible
    shortDescription: >-
      Un gilet sans manches, doublé, qui se porte des deux côtés — deux
      vêtements pour une seule coupe.
    fullDescription: |
      Un gilet de berger se coud sans manches ni col : c'est le premier vêtement que beaucoup réussissent seuls. Réversible, il se double d'un second tissu et se porte des deux côtés, ce qui en fait deux vêtements pour une seule coupe.

      Au programme : le choix des deux tissus, la coupe, l'assemblage et le retournement — le geste qui referme le gilet sans qu'aucune couture ne se voie. Prévoyez quatre heures et deux coupons qui vous plaisent autant l'un que l'autre.
    prerequisite: Connaissance de base de la machine à coudre recommandée.
    articles:
      - coutures-de-base
      - tissus-debutants
faqItems:
  - question: Quels sont les tarifs des stages de couture ?
    answer: >-
      Les tarifs varient en fonction du contenu du stage, de 45 € à 95 €.
      L'adhésion ponctuelle à l'association est comprise dans ce prix : il n'y a
      rien à régler en plus le jour du stage. Le tissu et les autres fournitures
      restent à votre charge.
  - question: Faut-il avoir de l'expérience pour participer à un stage ?
    answer: >-
      Non, la plupart des stages sont ouverts aux débutants. L'initiation à la
      machine à coudre est spécialement conçue pour les personnes qui n'ont
      jamais cousu. Pour les autres — surjeteuse, patronage, trousse, sac,
      banane, gilet — une connaissance de base de la machine à coudre est
      recommandée.
  - question: Quel matériel faut-il apporter ?
    answer: >-
      Chaque participant vient avec sa propre machine à coudre, ses accessoires
      et sa notice. Si vous n'avez pas de machine, Isabelle peut en prêter une
      sur demande préalable. Apportez également un petit cahier pour prendre
      des notes. Le tissu et les fournitures sont à votre charge, mais quelques
      coupons peuvent être mis à disposition.
  - question: Quelle est la taille des groupes ?
    answer: >-
      Les groupes sont volontairement limités à quelques participants pour
      garantir un accompagnement personnalisé. Chacun progresse à son rythme
      avec l'aide d'Isabelle.
  - question: Comment s'inscrire à un stage ?
    answer: >-
      La réservation se fait en ligne : le bouton « Réserver un stage », en haut
      de cette page, vous laisse choisir votre date et régler votre place, qui
      est retenue aussitôt. L'adhésion à l'association est comprise dans le
      tarif — il n'y a rien à régler en plus le jour du stage. Seules les dates
      où il reste de la place apparaissent, et elles partent vite : mieux vaut
      s'y prendre à l'avance. Si vous préférez vous arranger autrement, écrivez
      à Isabelle.
