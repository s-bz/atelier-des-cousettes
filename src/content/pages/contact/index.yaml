title: Contact
subtitle: Envoyez-nous un message
seoDescription: >-
  Contactez L'Atelier des Cousettes, à Revel (Haute-Garonne) et Verdalle (Tarn). Cours de couture,
  stages thématiques, ateliers réguliers — envoyez votre demande d'information.
coverImage: ''
coverImageAlt: ''
introduction: >-
  Une question sur nos cours, nos stages ou nos ateliers ? Une date qui vous
  intéresse ? Dites-le en quelques lignes ci-dessous : Isabelle vous répond
  elle-même, et vous inscrit si vous le souhaitez.
delaiReponse: >-
  Isabelle vous répond sous 48 h, du mardi au samedi. Aucune inscription n'est
  engagée par ce message : vous choisissez ensuite vos dates, et vous pouvez les
  libérer jusqu'à 48 h avant.
alternativeTexte: Vous préférez parler de vive voix ?
sections:
  - title: Venir jusqu'à l'atelier
    text: |-
      Appelez avant de venir. Isabelle n'est pas à l'atelier en permanence : une
      visite se convient par téléphone, et le numéro est juste au-dessus. Se
      présenter à l'improviste, c'est risquer de trouver porte close après la
      route.

      L'atelier est à Verdalle, dans le Tarn, à une vingtaine de minutes de
      Castres ; l'adresse complète figure en pied de page. Un mot d'avertissement
      qui épargne un détour, une fois le rendez-vous pris : « En Rivals » est un
      lieu-dit, et les GPS ne le placent pas tous au même endroit. Le plus sûr est
      de lancer l'itinéraire depuis la fiche Google de l'atelier.
