stageLabel: Le stage qui met ce geste en pratique
crossLinksText: >-
  Ces mots s'apprennent mieux la machine en main : ces trois formules les
  mettent en pratique.
ctaText: >-
  Ces mots s'apprennent en une séance, la machine devant soi, bien plus vite
  qu'en les lisant.
