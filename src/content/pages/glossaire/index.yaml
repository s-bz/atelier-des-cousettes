title: Glossaire de la couture
subtitle: Les mots de l'atelier, expliqués simplement
seoDescription: >-
  Glossaire de couture : surfilage, droit fil, embu, parementure, entoilage… Les
  termes que l'on entend en atelier, définis par Isabelle Bultez, couturière
  diplômée CAP à Revel et Verdalle (Tarn).
coverImage: ''
coverImageAlt: ''
introduction: |
  Un patron dit « cranter dans les angles », une notice parle de « griffes d'entraînement », une vendeuse demande quelle laize vous voulez. La couture a son vocabulaire, et il décourage plus de débutantes que les gestes eux-mêmes.

  Ces fiches définissent les mots que l'on entend à l'atelier, en une phrase d'abord, puis en détail. Chacune se termine par ce qu'Isabelle observe réellement sur ce geste, séance après séance — ce qu'aucun dictionnaire ne dira.
