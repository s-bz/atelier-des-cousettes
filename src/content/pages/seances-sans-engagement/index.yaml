title: Une séance sans engagement
subtitle: Cousez en toute liberté, à l’heure qui vous convient
seoDescription: >-
  Séance de couture sans engagement pour adultes à Revel (Haute-Garonne). 45 € les 3 h, 22 € la séance de 1 h 30 du jeudi soir, adhésion comprise.
coverImage: /src/assets/images/covers/seances-sans-engagement/coverImage.jpeg
coverImageAlt: Séance de couture ponctuelle à l'Atelier des Cousettes
introduction: >-
  Une séance ponctuelle pour coudre à votre rythme, avec l'accompagnement
  d'Isabelle : 3 heures en semaine ou le samedi. Nouveauté de cette saison, une
  séance plus courte d'1 h 30 le jeudi en fin de journée, pour apprendre une
  technique précise ou pour avancer sur un projet personnel. Sans engagement,
  ouvert à tous les niveaux.
priceLabel: la séance
location: ''
locationLabel: ''
descriptionTitle: Comment se déroule une séance ?
description: |
  Vous venez avec votre projet personnel — un vêtement à coudre, une retouche à faire, un accessoire à créer — et Isabelle vous accompagne pas à pas : choix du patron, coupe du tissu, assemblage, finitions. Si vous n'avez pas encore d'idée, elle peut vous proposer un petit projet adapté à votre niveau.

  Les groupes sont volontairement limités pour que chacun bénéficie d'une attention personnalisée. L'atmosphère est chaleureuse : on coud, on échange, on s'entraide.
ideesTitle: Quelques idées de ce qu'on peut y faire
ideesItems:
  - Coudre un ourlet
  - Mes p'tits points à la main
  - Poser une fermeture éclair sur une jupe ou un pantalon
  - Faire des poches
  - Apprendre à lire un patron
  - Couper et poser un biais
  - Questions libres
audienceTitle: À qui s'adresse cette formule ?
audienceItems:
  - Les débutants qui souhaitent découvrir la couture avant de s'engager.
  - >-
    Les couturiers qui souhaitent apprendre une technique précise : coudre un
    ourlet, poser une fermeture éclair, par exemple...
  - Les couturiers occasionnels qui ont besoin d'un coup de main ponctuel.
  - Les couturiers confirmés qui apprécient de coudre en groupe.
  - Ceux qui n'ont pas la disponibilité pour s'engager sur toute la saison.
datesTitle: Prochaines dates
lienDates: Voir les dates
lienDeroulement: Comment ça se passe
datesNote: Sous réserve d'un nombre suffisant d'inscriptions.
faqSectionTitle: Questions fréquentes
faqItems:
  - question: Quel est le tarif d'une séance ?
    answer: >-
      45 € pour une séance de 3 heures, et 22 € pour la séance de 1 h 30 du
      jeudi en fin de journée. L'adhésion ponctuelle à l'association Les P'tits
      Piafs est comprise dans ce tarif : il n'y a rien à régler en plus.
  - question: Faut-il apporter son matériel ?
    answer: >-
      Oui, chaque participant vient avec sa propre machine à coudre, ses
      accessoires et sa notice. Si vous n'avez pas de machine, Isabelle peut
      en prêter une sur demande préalable. Apportez également vos
      fournitures : tissu, fils, ciseaux, épingles.
  - question: Où ont lieu les séances ?
    answer: >-
      À la maison des associations de Revel, en Haute-Garonne, à vingt minutes
      de Castres. Parking gratuit à proximité. Les séances sans engagement ne
      sont pas proposées à Verdalle.
  - question: Quels projets peut-on réaliser en 1 h 30 ou en 3 h ?
    answer: |
      La séance d'une heure et demie est un moment privilégié pour une leçon de couture : apprendre à coudre un ourlet, apprendre les petits points à la main, savoir lire un patron, etc.

      L'atelier ponctuel de 3 heures peut vous permettre de réaliser une pochette, un tote bag, ou de commencer un projet plus ambitieux que vous poursuivrez chez vous. Isabelle vous aide à estimer le temps nécessaire.
  - question: Peut-on venir sans savoir coudre ?
    answer: >-
      Absolument. Isabelle prend le temps de vous montrer les bases :
      enfiler la machine, régler la tension, coudre droit, faire un ourlet.
      C'est une excellente façon de découvrir la couture.
  - question: Quelle est la politique d'annulation ?
    answer: >-
      Vous pouvez libérer votre place jusqu'à 10 jours avant la séance : elle ne
      vous est pas comptée. Passé ce délai, la séance reste due. Prévenez
      Isabelle dès que vous le savez — votre place profite alors à quelqu'un
      d'autre, prévenu par e-mail. Les séances ont lieu sous réserve d'un
      nombre suffisant d'inscriptions.
  - question: Comment s'inscrire ?
    answer: >-
      Pour une première venue, écrivez à Isabelle par le formulaire de
      contact ou appelez-la. Elle vous inscrit et vous ouvre l'accès à votre
      espace adhérent, où vous choisissez ensuite vos dates et les libérez
      si besoin. Les places étant limitées, mieux vaut s'y prendre à
      l'avance.
