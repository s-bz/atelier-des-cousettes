terme: Jersey
definitionCourte: |-
  Le jersey est un tissu tricoté, et non tissé : ses mailles lui donnent son élasticité. C'est la matière des t-shirts, des robes souples et de la plupart des vêtements d'enfant.
explication: |-
  Sa structure change tout à la couture. Il s'étire, il roule sur les bords, il ne s'effiloche pas — donc il ne demande pas de surfilage — mais une couture droite ordinaire y casse dès qu'on l'étire.

  Il faut donc un point qui s'allonge : petit zigzag, point extensible de la machine, ou surjeteuse. Et une aiguille à bout rond, qui écarte les mailles au lieu de les percer.

  Les jerseys se distinguent par leur grammage et leur composition : un jersey de coton pour un t-shirt, un jersey épais pour une robe d'hiver, un jersey avec élasthanne pour ce qui doit garder sa forme.
enAtelier: |-
  C'est la matière que je conseille en troisième ou quatrième projet, pas au premier — non parce qu'elle est difficile, mais parce qu'elle pardonne mal les réglages approximatifs.

  Une fois l'aiguille et le point réglés correctement, elle devient au contraire très facile : pas de surfilage, pas d'effilochage, et l'ampleur se rattrape à l'élasticité.
