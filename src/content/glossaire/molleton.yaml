terme: Molleton
definitionCourte: |-
  Le molleton est un tissu épais et doux, gratté sur une face ou sur les deux. Il sert de doublure chaude, de rembourrage plat pour le matelassage et de matière pour les sweats.
explication: |-
  On distingue le molleton d'habillement — le sweat, souvent gratté à l'intérieur, extensible s'il est tricoté — du molleton de matelassage, non extensible, qu'on prend en sandwich entre deux cotons pour un plaid ou une manique.

  Son épaisseur demande quelques ajustements : une aiguille plus grosse, un point plus long, et une main légère sur les épaisseurs superposées. Les ourlets se font en un seul repli, sur bord surfilé, pour éviter le bourrelet.

  Il rétrécit souvent au premier lavage, parfois beaucoup. On le décatit avant de couper.
enAtelier: |-
  L'erreur classique est de garder le point court des tissus fins. Sur trois épaisseurs de molleton, le tissu n'avance plus et la couture se tasse sur place.

  Passer à un point de 3 ou 3,5 change tout, et coûte un quart de tour de molette.
