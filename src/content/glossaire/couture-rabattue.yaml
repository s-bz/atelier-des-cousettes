terme: Couture rabattue
definitionCourte: |-
  La couture rabattue replie une marge sur l'autre et la pique à plat, ce qui donne une couture solide, plate et visible sur l'endroit — celle des jeans et des chemises d'homme.
explication: |-
  On assemble normalement, on recoupe une des deux marges de moitié, on replie la marge longue par-dessus la courte, et on pique au ras du pli.

  Le résultat est doublement solide : les bords sont enfermés, et deux piqûres traversent l'ensemble. C'est pourquoi on la trouve sur les vêtements de travail et sur tout ce qui se lave souvent.

  Elle se voit, et c'est assumé : la surpiqûre au fil contrasté d'un jean est exactement cela. Sur un vêtement où l'on ne veut rien voir, on préfère la couture anglaise.
enAtelier: |-
  Ce qui rate, c'est le repassage. La marge repliée doit être marquée au fer avant d'être piquée, sinon elle vrille sous le pied et la piqûre part en biais.

  On peut aussi la bâtir. Sur du denim épais, c'est même la seule façon d'obtenir une ligne droite du premier coup.
