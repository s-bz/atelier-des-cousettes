terme: Point invisible
definitionCourte: |-
  Le point invisible est un point de couture main qui ne laisse presque rien paraître sur l'endroit. On l'utilise pour les ourlets soignés, en n'attrapant qu'un ou deux fils du tissu à chaque passage.
explication: |-
  L'aiguille passe alternativement dans le repli de l'ourlet, où le fil peut courir librement, et dans le tissu du vêtement, où elle ne prend qu'un fil ou deux. C'est cette parcimonie qui rend le point invisible : plus on prend de matière, plus le point marque.

  Le fil doit être assorti au tissu et tiré sans le serrer. Un ourlet trop tendu se voit en creux sur l'endroit, ce qui est pire qu'un point apparent.

  Les machines proposent un point ourlet invisible, avec un pied dédié. Il va vite et convient aux tissus épais ou à motifs ; sur une matière fine et unie, la main reste plus discrète.
enAtelier: |-
  Le piège est de vouloir aller vite en prenant « juste un peu plus » de tissu à chaque point. On y gagne dix minutes et on obtient un ourlet gaufré.

  Un point tous les centimètres suffit largement sur un ourlet de jupe. Ce n'est pas un point de solidité : c'est un point de maintien.
