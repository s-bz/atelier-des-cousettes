terme: Marge de couture
definitionCourte: |-
  La marge de couture est la bande de tissu laissée entre la ligne de piqûre et le bord coupé. Elle vaut le plus souvent un centimètre en couture, un centimètre et demi sur les côtés à retoucher.
explication: |-
  Elle sert à trois choses : donner de quoi piquer sans que le bord s'effiloche jusqu'à la couture, permettre de cranter les arrondis, et laisser une réserve pour agrandir un vêtement plus tard.

  Tous les patrons ne l'incluent pas. Les patrons du commerce l'ajoutent presque toujours et le précisent ; les patrons de magazines et ceux qu'on trace soi-même sont souvent donnés bruts, à charge de l'ajouter à la coupe. Confondre les deux donne un vêtement trop petit de deux centimètres par couture.

  La largeur choisie doit rester constante sur toute une pièce, sinon les repères de montage ne tombent plus en face.
enAtelier: |-
  « Valeur de couture » et « marge de couture » désignent exactement la même chose, et les deux termes circulent dans les patrons français. Ce n'est pas une subtilité à apprendre : c'est un doublon de vocabulaire, et il fait hésiter tout le monde au début.

  La première question à poser devant un patron neuf est toujours la même : les marges sont-elles comprises ? Elle est écrite quelque part, il faut la chercher avant de couper.
