terme: Biais
definitionCourte: |-
  Le biais désigne la diagonale du tissu, à 45° du droit fil, seule direction où il s'étire. Par extension, une bande de biais est une bande coupée dans cette diagonale, qui sert à border les courbes.
explication: |-
  Un tissu tissé ne s'étire ni en longueur ni en largeur, mais il cède dans la diagonale. C'est cette souplesse qu'on exploite : une bande coupée en biais épouse une encolure ou une emmanchure sans faire un pli, ce qu'une bande droit fil ne fera jamais.

  Une jupe coupée en biais tombe en fluide et se moule au corps, pour la même raison. Elle demande en revanche du repos avant l'ourlet, car elle continue à descendre plusieurs heures.

  Les biais du commerce sont préparés, pliés et prêts à poser. Un biais coupé soi-même dans le tissu du vêtement reste plus discret.
enAtelier: |-
  La question qui revient : peut-on couper le biais un peu de travers pour économiser du tissu ? Non — à 30° ou 60°, la bande ne s'étire plus pareil et la courbe gondole.

  Le gabarit à 45° posé sur la lisière règle la question, et se refait en carton en deux minutes.
