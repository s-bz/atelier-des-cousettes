terme: Coulisse
definitionCourte: |-
  Une coulisse est un tunnel de tissu ménagé dans un vêtement pour y glisser un élastique ou un cordon. C'est ce qui permet de resserrer une taille, un poignet ou une capuche.
explication: |-
  On la forme en repliant le bord du tissu deux fois vers l'envers et en piquant au ras du pli, ce qui laisse un passage. La largeur du tunnel doit dépasser celle de l'élastique de trois ou quatre millimètres, sinon l'élastique se vrille et ne se répartit plus.

  On laisse une ouverture pour y entrer l'élastique — soit en interrompant la piqûre, soit par une boutonnière faite avant le montage si le cordon doit ressortir à l'extérieur.

  L'élastique s'enfile avec une épingle à nourrice ou un passe-lacet, et l'on épingle l'extrémité libre au tissu pour ne pas la voir disparaître dans le tunnel.
enAtelier: |-
  L'extrémité qui disparaît dans la coulisse est le grand classique du premier vêtement, et il n'y a rien à faire d'autre que tout ressortir et recommencer.

  L'épingle à nourrice plantée à l'entrée coûte trois secondes. Je la fais planter avant même de commencer à enfiler.
