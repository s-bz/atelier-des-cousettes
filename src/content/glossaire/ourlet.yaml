terme: Ourlet
definitionCourte: |-
  L'ourlet est la finition du bas d'un vêtement, obtenue en repliant le tissu vers l'envers et en le fixant. Il ferme le bord coupé et donne au vêtement son aplomb.
explication: |-
  Le plus courant est l'ourlet simple, replié deux fois pour enfermer le bord coupé, puis piqué à la machine. Un centimètre replié deux fois convient à une chemise ; trois à quatre centimètres donnent du poids au bas d'une jupe ou d'un pantalon.

  Sur une matière épaisse, on ne replie qu'une fois après avoir surfilé le bord : deux épaisseurs feraient un bourrelet.

  Sur un bas arrondi ou évasé, le repli est trop long pour la place disponible. On le résorbe par une ligne de points longs légèrement tirée, ou l'on choisit un ourlet plus étroit.

  Un ourlet se laisse toujours reposer suspendu une nuit avant d'être marqué : le tissu descend, surtout coupé en biais.
enAtelier: |-
  L'aplomb se mesure debout, chaussures aux pieds, par quelqu'un d'autre. Un ourlet marqué à plat sur la table donne un bas qui remonte devant — le corps n'est pas une planche.

  C'est la retouche que l'on me demande le plus souvent, et la plus simple à apprendre une fois pour toutes.
