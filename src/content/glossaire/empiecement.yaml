terme: Empiècement
definitionCourte: |-
  Un empiècement est une pièce rapportée en haut d'un vêtement — sur les épaules d'une chemise, au-dessus d'une poche de jean — qui supporte le reste et permet d'y attacher des fronces ou des plis.
explication: |-
  Il joue un rôle structurel : c'est lui qui repose sur les épaules et qui porte le poids du vêtement. Sous lui, le tissu peut être froncé, plissé ou évasé sans que l'ensemble s'affaisse.

  L'empiècement de chemise est souvent doublé de lui-même, ce qui enferme toutes les coutures d'épaule et donne l'intérieur net des chemises bien faites. Le montage se fait alors « en burrito », en roulant le corps de la chemise entre les deux épaisseurs.

  Il permet aussi de jouer sur les matières : un empiècement dans un tissu contrasté ou dans le droit fil transversal suffit à structurer un vêtement simple.
enAtelier: |-
  C'est la pièce qui donne le plus de satisfaction en atelier, parce que le résultat a l'air professionnel pour un travail qui ne l'est pas tant que ça.

  Le montage doublé fait peur sur le papier. Fait une fois avec quelqu'un à côté, il ne s'oublie plus.
