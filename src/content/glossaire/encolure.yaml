terme: Encolure
definitionCourte: |-
  L'encolure est l'ouverture du vêtement pour le cou. Sa forme — ronde, en V, bateau — et sa largeur définissent la ligne du haut du vêtement.
explication: |-
  Elle doit passer la tête sans bâiller une fois portée, deux exigences contradictoires que le patronage résout par une ouverture ou un tissu extensible. Un t-shirt en jersey s'en dispense ; un corsage en popeline demande une fermeture ou une encolure large.

  Elle se finit rarement par un simple ourlet : la courbe est trop serrée pour se replier à plat. On la borde d'un biais ou on la double d'une parementure, presque toujours entoilée pour l'empêcher de se détendre.

  Élargir une encolure d'un centimètre change beaucoup l'allure d'un vêtement, et c'est la modification de patron la plus simple à faire soi-même.
enAtelier: |-
  L'encolure qui bâille est la doléance numéro un, et la cause est presque toujours la même : pas d'entoilage, ou un biais posé en tirant.

  Un biais se pose détendu, presque relâché. Tiré, il tient bien le temps de l'essayage et se détend au premier lavage.
