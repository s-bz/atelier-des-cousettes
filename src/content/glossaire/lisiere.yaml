terme: Lisière
definitionCourte: |-
  La lisière est le bord fini du tissu, dans le sens de la longueur, qui ne s'effiloche pas. Elle sert de repère pour trouver le droit fil.
explication: |-
  C'est le bord que le métier à tisser referme sur lui-même : plus dense, parfois plus rigide, souvent imprimé du nom du fabricant et des couleurs employées. Elle court parallèlement aux fils de chaîne, donc au droit fil.

  D'où son usage principal : c'est à elle que l'on mesure pour poser la flèche d'un patron. Deux mesures identiques entre la flèche et la lisière, et la pièce est droit fil.

  On ne l'intègre pas au vêtement. Plus serrée que le reste, elle tire à la couture et se rétracte différemment au lavage — on la coupe avant de tailler.
enAtelier: |-
  La question revient souvent : peut-on utiliser la lisière comme finition, puisqu'elle ne s'effiloche pas ? Sur un ouvrage décoratif, oui. Sur un vêtement, non.

  Elle a une autre utilité méconnue : les trous d'épingle qu'elle porte ont un bord en relief, et ce relief est du côté de l'endroit. C'est un bon repère sur un tissu où les deux faces se ressemblent.
