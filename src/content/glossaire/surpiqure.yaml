terme: Surpiqûre
definitionCourte: |-
  La surpiqûre est une piqûre faite sur l'endroit du vêtement, visible, qui maintient une couture à plat ou souligne une ligne. Elle est décorative autant que fonctionnelle.
explication: |-
  Elle sert d'abord à tenir : une marge surpiquée reste couchée du bon côté après lavage, ce qu'aucun repassage ne garantit durablement. C'est ce qui donne aux poches, aux cols et aux ceintures leur aspect net.

  Elle sert ensuite à décorer. Le fil à surpiquer est plus épais que le fil de couture, souvent contrasté ; on l'utilise seulement sur l'aiguille, la canette gardant un fil ordinaire.

  La régularité est tout : une surpiqûre se juge à sa distance constante au bord, et cette distance se tient au bord du pied-de-biche ou au guide gradué de la plaque, jamais à l'œil.
enAtelier: |-
  Regarder l'aiguille est le réflexe naturel, et c'est ce qui fait onduler la ligne. Je fais poser le regard sur le bord du pied, à un centimètre devant : la main suit ce que l'œil fixe.

  Ralentir aide plus que tout. Une surpiqûre réussie se coud à la vitesse d'une conversation, pas à celle d'une couture d'assemblage.
