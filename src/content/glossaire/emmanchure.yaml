terme: Emmanchure
definitionCourte: |-
  L'emmanchure est l'ouverture du vêtement où vient se coudre la manche. Sa courbe, plus creuse devant que derrière, détermine la liberté de mouvement du bras.
explication: |-
  Elle n'est pas symétrique, et c'est ce qui surprend au premier patronage : le devant est plus échancré que le dos, parce que le bras part vers l'avant. Une emmanchure symétrique donne un vêtement qui tire dès qu'on lève les coudes.

  Sa profondeur fait le compromis : haute et étroite, elle permet de lever le bras sans que tout le vêtement suive, ce qui est le principe d'une veste bien coupée ; basse et large, elle est confortable au repos mais entraîne le corsage à chaque mouvement.

  La tête de manche qui s'y coud est plus longue de un à trois centimètres : c'est l'embu, qui loge l'arrondi de l'épaule.
enAtelier: |-
  Une emmanchure qui serre ne se corrige pas en la creusant davantage : on gagne un peu d'aisance et on perd tout le maintien, et la manche ne remonte plus.

  Neuf fois sur dix, le problème est ailleurs — carrure trop étroite, ou tête de manche mal répartie. Je fais toujours mesurer la carrure avant de toucher à la courbe.
