terme: Décatir
definitionCourte: |-
  Décatir un tissu, c'est le laver avant de le couper pour provoquer son rétrécissement à l'avance. Sans cette précaution, le vêtement rétrécit après le premier lavage.
explication: |-
  Un coton peut perdre trois à cinq pour cent de ses dimensions au premier lavage, et une toile de lin davantage. Sur une robe, cela représente plusieurs centimètres — assez pour qu'elle ne se ferme plus.

  On lave le tissu comme on lavera le vêtement fini : même température, même séchage. C'est la seule façon de savoir ce qu'il fera ensuite.

  On sèche puis on repasse avant de couper, faute de quoi les pièces seront taillées dans un tissu froissé et donc faussées. Les matières qui ne se lavent pas — laine à sec, soie — se détendent simplement à la vapeur.
enAtelier: |-
  Personne n'a envie de laver trois mètres de tissu neuf avant d'y toucher, et je l'entends. Mais c'est la seule étape irrattrapable de tout le processus.

  Un pantalon trop court après le premier lavage ne se rallonge pas. Je le rappelle à chaque achat de tissu, et j'ai encore des retouches qui viennent de là.
