terme: Laize
definitionCourte: |-
  La laize est la largeur d'un rouleau de tissu, d'une lisière à l'autre. Elle vaut le plus souvent 110, 140 ou 150 cm, et détermine le métrage nécessaire à un projet.
explication: |-
  Un patron annonce ses besoins en fonction de la laize : « 2,10 m en 140 » ne signifie pas la même chose que « 2,10 m en 110 ». Acheter la bonne longueur dans la mauvaise laize est la façon la plus courante de manquer de tissu.

  Les cotons de mercerie sont généralement en 110 cm, les tissus d'ameublement et les lainages en 140 ou 150. Un tissu tubulaire — certains jerseys — est vendu plié et fermé, et sa laize utile est le double de sa largeur apparente.

  Quand la laize disponible est plus étroite que celle du patron, on recalcule en posant les pièces à plat : parfois deux longueurs suffisent, parfois il en faut trois.
enAtelier: |-
  Le calcul se fait au magasin, pas à la maison. Je conseille toujours d'emporter la liste des pièces avec leurs dimensions, quitte à la griffonner.

  Vingt centimètres de plus coûtent peu ; retourner chercher le même coloris trois semaines plus tard coûte souvent le projet entier.
