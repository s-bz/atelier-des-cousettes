terme: Pied-de-biche
definitionCourte: |-
  Le pied-de-biche est la pièce qui plaque le tissu contre les griffes d'entraînement pendant la couture. Il se change selon le travail : fermeture éclair, boutonnière, ourlet invisible.
explication: |-
  Son rôle est de maintenir une pression constante pour que les griffes puissent faire avancer le tissu régulièrement. Sans lui, le tissu resterait sur place et l'aiguille piquerait vingt fois au même endroit.

  Chaque pied résout un problème précis. Le pied à fermeture permet de piquer au ras des dents en décalant l'aiguille ; le pied ourleur replie le tissu au fur et à mesure ; le pied téflon glisse sur le simili qui accroche ; le pied double entraînement fait avancer les deux épaisseurs à la même vitesse.

  Son bord sert aussi de guide : sur la plupart des machines, le tissu aligné sur le bord droit du pied donne une couture à un centimètre du bord.
enAtelier: |-
  Une machine d'entrée de gamme livrée avec quatre pieds fait presque tout. Je vois régulièrement des gens acheter une machine plus chère pour des fonctions qu'ils n'utiliseront pas, alors qu'un pied à dix euros aurait réglé leur problème.

  Le premier à acheter, si l'on n'en a qu'un : le pied à fermeture éclair.
