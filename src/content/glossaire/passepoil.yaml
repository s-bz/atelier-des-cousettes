terme: Passepoil
definitionCourte: |-
  Le passepoil est un liseré de tissu, parfois garni d'une cordelette, inséré dans une couture pour en souligner la ligne. On le voit sur les coussins, les poches et les vestes.
explication: |-
  Il se coud en sandwich : on le pose sur l'endroit d'une pièce, bords alignés, on ajoute la seconde pièce endroit contre endroit, et l'on pique le tout. Une fois retourné, seul le liseré dépasse.

  Le pied à fermeture éclair ou un pied à passepoil permet de piquer au plus près de la cordelette. Toute la difficulté est là : une piqûre trop lâche laisse voir le tissu du passepoil, et l'effet de ligne disparaît.

  Coupé en biais, il épouse les courbes ; coupé droit fil, il ne convient qu'aux lignes droites.
enAtelier: |-
  Les angles sont le vrai sujet. Sur un coussin, il faut cranter le passepoil dans la marge à l'approche de chaque coin, sinon il tire et l'angle s'arrondit.

  Trois petites entailles avant le coin, et l'angle reste net.
