terme: Couture anglaise
definitionCourte: |-
  La couture anglaise enferme les bords coupés à l'intérieur de la couture elle-même. On assemble d'abord envers contre envers, on recoupe, puis on repique endroit contre endroit : aucun bord ne reste visible ni à surfiler.
explication: |-
  C'est la finition des chemisiers, des vêtements d'enfant et de tout ce qui se porte sans doublure. Elle se fait en deux piqûres, dans l'ordre inverse de l'habitude.

  Première piqûre, envers contre envers, à 5 mm du bord. On recoupe la marge à 3 mm, on retourne, on repasse pour bien marquer l'arête, puis on pique à 7 mm : les bords coupés se retrouvent enfermés dans un petit tunnel.

  Elle demande une marge de couture d'un centimètre au minimum, et elle ne convient qu'aux tissus fins et aux coutures droites. Sur une emmanchure arrondie, elle fait des plis.
enAtelier: |-
  La difficulté n'est pas technique, elle est mentale : commencer envers contre envers va contre tout ce qu'on vient d'apprendre, et la moitié de la classe assemble à l'endroit par réflexe.

  Je fais écrire les deux mesures sur une chute agrafée à l'ouvrage. 5 puis 7 — l'ordre compte, l'écart aussi.
