terme: Fronces
definitionCourte: |-
  Les fronces sont l'ampleur obtenue en resserrant un tissu sur un fil tiré, pour coudre une longueur importante sur une longueur plus courte — une jupe sur une ceinture, une tête de manche sur une emmanchure.
explication: |-
  On pique deux lignes de points longs, sans point d'arrêt, dans la marge de couture. On tire ensuite les fils de canette des deux lignes ensemble, et le tissu se resserre en petits plis réguliers.

  Deux lignes plutôt qu'une : elles tiennent le tissu droit et empêchent les plis de basculer. C'est aussi une assurance, un fil pouvant casser sous la traction.

  On répartit ensuite les fronces à la main jusqu'à ce que la longueur corresponde exactement à la pièce à laquelle on va la coudre, puis on pique par-dessus, fronces vers le haut pour les voir se placer.
enAtelier: |-
  L'erreur habituelle est de tirer sur les deux extrémités en même temps, ce qui bloque le fil au milieu et finit par le casser. On tire d'un seul côté, en faisant glisser le tissu de l'autre main.

  Et l'on fronce toujours un peu plus large que nécessaire : détendre des fronces trop serrées est facile, en rajouter quand le fil est coupé ne l'est pas.
