terme: Boutonnière
definitionCourte: |-
  Une boutonnière est la fente renforcée par laquelle passe un bouton. Les machines modernes la cousent automatiquement à la taille du bouton placé dans le pied prévu.
explication: |-
  Sa longueur vaut le diamètre du bouton plus son épaisseur, plus deux millimètres de jeu. Trop courte, le bouton force ; trop longue, il ressort tout seul.

  Le tissu doit être entoilé à cet endroit, sans exception : la boutonnière est le point du vêtement qui subit le plus de traction, et un tissu non renforcé s'y déchire à la longue.

  On coud d'abord, on ouvre ensuite, au découvit ou au ciseau à broder, en plantant une épingle en travers à chaque extrémité pour éviter de couper au-delà.

  Verticales sur une patte de boutonnage étroite, horizontales là où la traction s'exerce en travers — la ceinture d'un pantalon, l'encolure d'une chemise.
enAtelier: |-
  L'épingle en travers avant d'ouvrir, systématiquement. C'est la seule étape qui peut ruiner un vêtement fini en un geste, et elle arrive à la toute fin, quand on est fatigué et pressé d'avoir terminé.

  On fait aussi toujours un essai sur une chute de même épaisseur, entoilage compris.
