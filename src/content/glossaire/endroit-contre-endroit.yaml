terme: Endroit contre endroit
definitionCourte: |-
  Endroit contre endroit désigne la façon d'assembler deux pièces en plaçant leurs faces visibles l'une contre l'autre, de sorte que la couture se retrouve à l'intérieur une fois l'ouvrage retourné.
explication: |-
  C'est l'instruction la plus répétée de toutes les notices, et la plus vite lue. Elle signifie que les deux belles faces se regardent pendant qu'on coud, et qu'elles se retrouveront dehors une fois l'ouvrage retourné.

  Encore faut-il distinguer l'endroit de l'envers, ce qui n'a rien d'évident sur une popeline unie ou une toile de lin. Les repères existent : l'impression est plus nette sur l'endroit, la lisière porte souvent des trous dont les bords ressortent côté envers, et un jersey roule vers l'endroit dans le sens de la largeur.

  Dans le doute, on choisit une face au début du projet et on la marque à la craie sur toutes les pièces.
enAtelier: |-
  C'est l'erreur que l'on ne voit qu'à la fin, quand le vêtement est retourné et que les coutures sont dehors. Elle arrive à tout le monde, et elle arrive surtout sur les tissus où les deux faces se ressemblent.

  D'où la craie dès la coupe. Trente secondes par pièce, contre une soirée de découvit.
