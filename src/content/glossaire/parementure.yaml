terme: Parementure
definitionCourte: |-
  La parementure est une pièce de tissu cousue le long d'un bord — encolure, devant, emmanchure — puis retournée à l'intérieur, où elle finit le bord proprement sans qu'aucune couture n'apparaisse.
explication: |-
  C'est la solution propre pour finir un bord courbe, là où un simple ourlet ferait des plis. Elle est coupée dans la même forme que le bord qu'elle doit finir, ce qui lui permet d'épouser la courbe exactement.

  Elle est presque toujours entoilée : sans thermocollant, une encolure se détend à l'usage et bâille. On la sous-pique ensuite — une piqûre à travers la parementure et les marges — pour l'empêcher de rouler vers l'extérieur.

  À ne pas confondre avec la doublure, qui couvre tout l'intérieur du vêtement, alors que la parementure ne borde qu'un bord.
enAtelier: |-
  La sous-piqûre est l'étape que les notices mentionnent en une ligne et que personne ne fait. C'est pourtant elle qui décide si l'encolure reste sagement à l'intérieur ou remonte se montrer au premier mouvement.

  Deux minutes de piqûre, et la différence se voit à trois mètres.
