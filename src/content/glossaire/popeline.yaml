terme: Popeline
definitionCourte: |-
  La popeline est un tissu de coton fin, tissé serré, à l'aspect lisse et légèrement côtelé. C'est le tissu des chemises et l'un des plus faciles à coudre.
explication: |-
  Son tissage serré la rend stable : elle ne s'étire pas, ne glisse pas sous le pied-de-biche et se repasse nettement. Toutes les propriétés qui font qu'on la recommande pour un premier vêtement.

  Elle se marque bien au fer, ce qui est un avantage réel — les plis, les replis d'ourlet et les marges ouvertes restent où on les met, et la moitié de la précision d'une couture vient de là.

  Elle s'effiloche en revanche comme tout tissé, et demande donc un surfilage ou une couture anglaise.
enAtelier: |-
  C'est le tissu que je propose pour les premières séances, et pour une raison prosaïque : quand quelque chose rate, on sait que ce n'est pas la faute de la matière.

  Apprendre sur un satin glissant ou une viscose fuyante fait douter de soi pour de mauvaises raisons.
