name: CSP smoke test

# Verifies the live Content-Security-Policy header still contains every
# origin declared in `src/config/csp.js`.
#
# On `deployment_status`, we deliberately do NOT use
# `deployment_status.target_url` — Vercel sets that to the internal
# deployment alias (e.g. <project>-<hash>.vercel.app), which sits behind
# Vercel Deployment Protection and returns 401 with no CSP header.
# Instead we always check the public custom domain, which is where the
# header actually matters for real users.

on:
  deployment_status:
  workflow_dispatch:
    inputs:
      url:
        description: 'Base URL to check (default: production domain)'
        required: false
        default: 'https://atelier-des-cousettes.fr'

env:
  PRODUCTION_URL: https://atelier-des-cousettes.fr

jobs:
  check:
    # Déploiements de PRODUCTION seulement.
    #
    # Le contrôle compare le fichier de référence de la BRANCHE au en-tête servi
    # par le DOMAINE DE PRODUCTION. Sur un déploiement de préversion, ces deux
    # côtés ne décrivent pas le même déploiement : toute PR touchant à la CSP
    # échouait donc par construction, en signalant comme un défaut ce qui n'est
    # qu'un changement pas encore mis en ligne.
    #
    # La préversion ne peut pas être contrôlée à sa place : son URL est derrière
    # la protection de déploiement Vercel et répond 401, sans en-tête.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'deployment_status' &&
       github.event.deployment_status.state == 'success' &&
       contains(fromJSON('["Production","production"]'),
                github.event.deployment_status.environment))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      # Un contrôle qui cesse silencieusement de tourner est pire qu'un contrôle
      # qui échoue : on croit être couvert. Cette ligne laisse une trace de
      # l'environnement reconnu, de quoi diagnostiquer si Vercel changeait un
      # jour la casse de « Production ».
      - name: Environnement déployé
        run: echo "environment = ${{ github.event.deployment_status.environment || 'manuel' }}"

      - name: Verify CSP against SSOT
        env:
          TARGET_URL: >-
            ${{ github.event_name == 'workflow_dispatch'
                && github.event.inputs.url
                || env.PRODUCTION_URL }}
        run: node scripts/check-csp.mjs "$TARGET_URL"
